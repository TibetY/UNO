# Netlify: build the React app in web/ and serve its output.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The relay for online games (web/netlify/functions/room.mts), stored in Netlify Blobs.
[functions]
  directory = "netlify/functions"
